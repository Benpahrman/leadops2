name: LeadOps Scheduled Delivery Pipeline

on:
  schedule:
    # 6:00 AM UTC daily (Monday - Friday)
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      lead_id:
        description: 'Specific lead ID to trigger delivery for (optional)'
        required: false
        default: 'all'

jobs:
  run-daily-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          playwright install --with-deps chromium

      - name: Execute Delivery Jobs Before 8:00 AM Deadline
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          SENDPULSE_CLIENT_ID: ${{ secrets.SENDPULSE_CLIENT_ID }}
          SENDPULSE_CLIENT_SECRET: ${{ secrets.SENDPULSE_CLIENT_SECRET }}
          LEAD_ID_FILTER: ${{ github.event.inputs.lead_id || 'all' }}
        run: |
          python -c "
          from datetime import datetime, timezone
          from agents.delivery import DeliveryJob, DeliveryPlan, LocalCsvDestination
          from agents.storage import SqliteStorageBackend
          
          storage = SqliteStorageBackend()
          leads = storage.list_leads()
          print(f'Starting delivery run at {datetime.now(timezone.utc).isoformat()}')
          for lead in leads:
              if lead.deposit_paid and (lead.final_paid or lead.buyout_paid):
                  print(f'Processing delivery for lead {lead.lead_id} ({lead.tier_key})')
          "

      - name: Archive Delivery Audit Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-audit-logs
          path: leadops.db
          retention-days: 14
