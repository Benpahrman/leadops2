name: LeadOps Azure CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: "rg-omnileadfeeder-production"
  ACR_LOGIN_SERVER: "cromnilead1110.azurecr.io"
  ACR_NAME: "cromnilead1110"
  AZURE_CLIENT_ID: "941ee283-b0b9-425d-ae1a-1b0e2af49341"
  AZURE_TENANT_ID: "d0547f8c-7cec-4eb6-b27c-6bb508b6c57c"
  AZURE_SUBSCRIPTION_ID: "52efa1e6-344c-46e1-bd00-3a15f0f07683"

jobs:
  test-and-lint:
    name: Run Test Suite & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React SPA
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Install Python Dependencies & Run Tests
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pytest -q tests/test_storage.py tests/test_api.py tests/test_observability.py

  build-and-deploy:
    name: Build Containers & Deploy to Azure
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push API Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/leadops-api:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/leadops-api:latest -f Dockerfile .
          docker push ${{ env.ACR_LOGIN_SERVER }}/leadops-api:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/leadops-api:latest

      - name: Build & Push Swarm Worker Image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/leadops-worker:${{ github.sha }} -t ${{ env.ACR_LOGIN_SERVER }}/leadops-worker:latest -f Dockerfile.worker .
          docker push ${{ env.ACR_LOGIN_SERVER }}/leadops-worker:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/leadops-worker:latest

      - name: Update Azure Container Apps Revisions
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update \
            --name aca-leadops-api-production \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/leadops-api:${{ github.sha }}
          
          az containerapp update \
            --name aca-leadops-worker-production \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/leadops-worker:${{ github.sha }}
