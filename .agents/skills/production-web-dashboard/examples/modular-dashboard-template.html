<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Modular Dashboard Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #070d18;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #162238;
      --bg-surface-hover: #1e2e4a;
      --bg-glass: rgba(15, 23, 42, 0.82);
      
      --border-subtle: #1e2e4a;
      --border-medium: #2c4266;
      --border-accent: #38bdf8;

      --text-primary: #f0f6fc;
      --text-secondary: #8ca0be;
      --text-muted: #566d8f;

      --accent-cyan: #38bdf8;
      --accent-cyan-glow: rgba(56, 189, 248, 0.15);
      --status-success: #10b981;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;

      --font-main: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;

      --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Layout Header */
    header.app-header {
      height: 64px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .brand-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      background: var(--accent-cyan-glow);
      color: var(--accent-cyan);
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-cyan);
    }

    main.app-container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
    }

    /* Skeleton Animation */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--bg-surface-elevated) 25%, var(--bg-surface-hover) 50%, var(--bg-surface-elevated) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite ease-in-out;
      border-radius: var(--radius-sm);
    }

    /* Metric Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      transition: transform 0.2s, border-color 0.2s;
    }
    .metric-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-medium);
    }
    .metric-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .metric-label {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }
    .metric-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--status-success);
    }
    .metric-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }

    /* Filter Bar */
    .filter-bar {
      display: flex;
      gap: 16px;
      align-items: center;
      background: var(--bg-surface);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .search-input {
      flex: 1;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-cyan);
    }

    /* Data Table */
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    table.data-table th {
      background: var(--bg-surface-elevated);
      padding: 12px 18px;
      font-size: 0.8rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-subtle);
    }
    table.data-table td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.9rem;
    }
    table.data-table tbody tr:hover {
      background: var(--bg-surface-hover);
    }

    /* Status Pills */
    .status-pill {
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-pill.success { background: rgba(16, 185, 129, 0.15); color: var(--status-success); }
    .status-pill.warning { background: rgba(245, 158, 11, 0.15); color: var(--status-warning); }
    .status-pill.danger { background: rgba(239, 68, 68, 0.15); color: var(--status-danger); }

    /* Button */
    .btn {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-secondary {
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-medium);
    }
    .btn-secondary:hover {
      background: var(--bg-surface-hover);
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="brand">
      <span>LeadOps Intelligence Hub</span>
      <span class="brand-badge">Production v2.4</span>
    </div>
    <div id="userProfileMount"></div>
  </header>

  <main class="app-container">
    <!-- Metric Cards Container -->
    <section id="metricsContainer"></section>

    <!-- Filters Container -->
    <section id="filterBarContainer"></section>

    <!-- Live Data Table Container -->
    <section id="tableContainer"></section>
  </main>

  <script>
    // --- 1. Central Reactive State Store ---
    class ReactiveStore {
      constructor(initialState) {
        this.state = initialState;
        this.subscribers = new Map();
      }
      getState() { return this.state; }
      setState(delta) {
        const prev = { ...this.state };
        this.state = { ...this.state, ...delta };
        Object.keys(delta).forEach(key => {
          if (this.subscribers.has(key)) {
            this.subscribers.get(key).forEach(fn => fn(this.state[key], prev[key]));
          }
        });
      }
      subscribe(key, fn) {
        if (!this.subscribers.has(key)) this.subscribers.set(key, new Set());
        this.subscribers.get(key).add(fn);
        return () => this.subscribers.get(key).delete(fn);
      }
    }

    const store = new ReactiveStore({
      metrics: null,
      records: [],
      filterQuery: '',
      statusFilter: 'all',
      isLoading: true
    });

    // --- 2. KPI Metrics Component ---
    class MetricWidget {
      constructor(containerId) {
        this.el = document.getElementById(containerId);
        this.renderSkeleton();
        store.subscribe('metrics', (metrics) => this.render(metrics));
      }
      renderSkeleton() {
        this.el.innerHTML = `
          <div class="metrics-grid">
            ${[1,2,3,4].map(() => `
              <div class="metric-card">
                <div class="skeleton" style="height: 14px; width: 50%; margin-bottom: 12px;"></div>
                <div class="skeleton" style="height: 32px; width: 70%;"></div>
              </div>
            `).join('')}
          </div>
        `;
      }
      render(data) {
        if (!data) return;
        this.el.innerHTML = `
          <div class="metrics-grid">
            <div class="metric-card">
              <div class="metric-header"><span class="metric-label">Discovered Records</span><span class="metric-badge">Live</span></div>
              <div class="metric-value">${data.total_discovered?.toLocaleString() ?? 0}</div>
            </div>
            <div class="metric-card">
              <div class="metric-header"><span class="metric-label">Qualified Leads</span><span class="metric-badge">Verified</span></div>
              <div class="metric-value">${data.qualified_count?.toLocaleString() ?? 0}</div>
            </div>
            <div class="metric-card">
              <div class="metric-header"><span class="metric-label">Delivered Successfully</span><span class="metric-badge">100% SLA</span></div>
              <div class="metric-value">${data.delivered_count?.toLocaleString() ?? 0}</div>
            </div>
            <div class="metric-card">
              <div class="metric-header"><span class="metric-label">Pipeline Status</span><span class="metric-badge">${data.health || 'Optimal'}</span></div>
              <div class="metric-value">${data.active_pipelines ?? 0} Active</div>
            </div>
          </div>
        `;
      }
    }

    // --- 3. Filter Bar Component ---
    class FilterWidget {
      constructor(containerId) {
        this.el = document.getElementById(containerId);
        this.render();
      }
      render() {
        this.el.innerHTML = `
          <div class="filter-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search real records by parcel, owner, address, or ID...">
            <button class="btn btn-secondary" id="refreshBtn">↻ Refresh Feed</button>
          </div>
        `;
        this.el.querySelector('#searchInput').addEventListener('input', (e) => {
          store.setState({ filterQuery: e.target.value.toLowerCase() });
        });
        this.el.querySelector('#refreshBtn').addEventListener('click', () => {
          loadDashboardData();
        });
      }
    }

    // --- 4. Live Table Component ---
    class TableWidget {
      constructor(containerId) {
        this.el = document.getElementById(containerId);
        this.renderSkeleton();
        store.subscribe('records', () => this.update());
        store.subscribe('filterQuery', () => this.update());
      }
      renderSkeleton() {
        this.el.innerHTML = `
          <div class="table-card" style="padding: 20px;">
            <div class="skeleton" style="height: 40px; margin-bottom: 12px;"></div>
            <div class="skeleton" style="height: 30px; margin-bottom: 8px;"></div>
            <div class="skeleton" style="height: 30px; margin-bottom: 8px;"></div>
            <div class="skeleton" style="height: 30px;"></div>
          </div>
        `;
      }
      update() {
        const { records, filterQuery } = store.getState();
        let filtered = records;
        if (filterQuery) {
          filtered = records.filter(r => JSON.stringify(r).toLowerCase().includes(filterQuery));
        }

        if (filtered.length === 0) {
          this.el.innerHTML = `
            <div class="table-card" style="padding: 40px; text-align: center; color: var(--text-secondary);">
              <p>No records match your query.</p>
            </div>
          `;
          return;
        }

        const keys = Object.keys(filtered[0]).slice(0, 6);
        this.el.innerHTML = `
          <div class="table-card">
            <table class="data-table">
              <thead>
                <tr>
                  ${keys.map(k => `<th>${k.replace(/_/g, ' ')}</th>`).join('')}
                  <th style="text-align: right;">Action</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map(row => `
                  <tr>
                    ${keys.map(k => `<td>${row[k] ?? '—'}</td>`).join('')}
                    <td style="text-align: right;">
                      <button class="btn btn-secondary" onclick="alert('Record ID: ' + '${row.id || row.lead_id}')">View</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    // --- 5. Real Data Fetch Pipeline ---
    async function loadDashboardData() {
      try {
        // Fetch real data from backend API endpoint
        const leadId = window.location.pathname.split('/').pop() || 'primary-feed';
        const response = await fetch(`/api/dashboard/${leadId}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        
        store.setState({
          metrics: {
            total_discovered: data.total_discovered || data.lead_count || 0,
            qualified_count: data.qualified_count || 0,
            delivered_count: data.delivered_count || 0,
            active_pipelines: data.active_pipelines || 1,
            health: 'Healthy'
          },
          records: data.leads || data.records || [],
          isLoading: false
        });
      } catch (err) {
        console.error('Failed loading live dashboard data:', err);
      }
    }

    // Mount all components
    new MetricWidget('metricsContainer');
    new FilterWidget('filterBarContainer');
    new TableWidget('tableContainer');

    // Initiate real data fetch
    loadDashboardData();
  </script>
</body>
</html>
