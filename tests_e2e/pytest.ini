# pytest configuration for E2E tests
[pytest]
testpaths = tests_e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    --strict-markers
    --strict-config

markers =
    e2e: End-to-end tests requiring running services
    auth: Authentication tests
    payments: Payment flow tests
    dev_swarm: Dev swarm build tests
    api: API-level tests

[tool.playwright]
base_url = http://127.0.0.1:5173
browser = chromium
headed = false
slowmo = 0